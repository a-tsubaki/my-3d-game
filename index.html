<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ジャングルラッシュ！ポコの大冒険</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{overflow:hidden;background:#000;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",sans-serif;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font-size:22px;font-weight:bold;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:5}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,40,20,.6);color:#fff;text-align:center;z-index:10;cursor:pointer}
.ov h1{font-size:clamp(32px,7vw,64px);color:#ffcc33;text-shadow:4px 4px 0 #a33;margin-bottom:16px}
.ov p{font-size:18px;margin:6px;text-shadow:2px 2px 0 #000}
.btn{margin-top:20px;padding:14px 40px;font-size:24px;background:#ff8a00;border:4px solid #fff;border-radius:40px;color:#fff;font-weight:bold;animation:pul 1s infinite}
@keyframes pul{50%{transform:scale(1.08)}}
.hide{display:none!important}
#touch{position:fixed;bottom:16px;left:0;right:0;pointer-events:none;z-index:6}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:bold}
#msg{position:fixed;top:40%;width:100%;text-align:center;color:#ffcc33;font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #a33;pointer-events:none;z-index:7;transition:opacity .3s;opacity:0}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"><div>🍎 <span id="fr">0</span>　📦 <span id="cr">0</span></div><div>⭐ <span id="sc">0</span></div><div>❤️ <span id="lv">3</span></div></div>
<div id="msg"></div>
<div id="start" class="ov"><h1>ジャングルラッシュ！</h1><p>ポコを操作してゴールの旗を目指そう！</p><p>矢印/WASD：移動　スペース：ジャンプ　X/Shift：スピン</p><p>木箱を壊してフルーツ集め！100個で1UP</p><div class="btn">タップでスタート</div></div>
<div id="over" class="ov hide"><h1 id="otitle">ゲームオーバー</h1><p id="oscore"></p><p id="ohigh"></p><div class="btn">もう一度</div></div>
<div id="touch" class="hide">
<div class="tb" data-k="l" style="left:16px;bottom:50px">◀</div>
<div class="tb" data-k="r" style="left:136px;bottom:50px">▶</div>
<div class="tb" data-k="u" style="left:76px;bottom:110px">▲</div>
<div class="tb" data-k="d" style="left:76px;bottom:0">▼</div>
<div class="tb" data-k="j" style="right:16px;bottom:20px;width:80px;height:80px">JUMP</div>
<div class="tb" data-k="s" style="right:110px;bottom:60px;width:72px;height:72px">SPIN</div>
</div>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x88d8ff);scene.fog=new THREE.Fog(0x88d8ff,30,90);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x336633,0.9));
const sun=new THREE.DirectionalLight(0xfff2cc,1.6);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});
scene.add(sun,sun.target);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function tex(draw,s=128){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const crateTex=tex((g,s)=>{g.fillStyle='#c8873a';g.fillRect(0,0,s,s);g.strokeStyle='#7a4a1a';g.lineWidth=10;g.strokeRect(5,5,s-10,s-10);g.beginPath();g.moveTo(0,0);g.lineTo(s,s);g.moveTo(s,0);g.lineTo(0,s);g.stroke();g.fillStyle='#ffdd55';g.font='bold 50px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',s/2,s/2)});
const groundTex=tex((g,s)=>{g.fillStyle='#5cb84a';g.fillRect(0,0,s,s);for(let i=0;i<300;i++){g.fillStyle=Math.random()<.5?'#4ea83e':'#6fcf58';g.fillRect(Math.random()*s,Math.random()*s,3,6)}});
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;

const G={box:new THREE.BoxGeometry(1,1,1),sph:new THREE.SphereGeometry(1,16,12),cyl:new THREE.CylinderGeometry(1,1,1,10),cone:new THREE.ConeGeometry(1,1,8)};
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
const crateMat=new THREE.MeshStandardMaterial({map:crateTex});
const fruitMat=new THREE.MeshStandardMaterial({color:0xff3344,emissive:0x661111,roughness:.3});
const leafMat=M(0x2f9a3a),trunkMat=M(0x7a5230),dirtMat=M(0x8a5a30);
function mesh(geo,mat,sx=1,sy=1,sz=1,shadow=true){const m=new THREE.Mesh(geo,mat);m.scale.set(sx,sy,sz);m.castShadow=shadow;m.receiveShadow=true;return m}
function at(m,x,y,z){m.position.set(x,y,z);return m}

const W=3.2,LEN=320;
const level=new THREE.Group();scene.add(level);
let segs=[],crates=[],fruits=[],enemies=[],goalZ=0;
const water=mesh(new THREE.PlaneGeometry(400,600),new THREE.MeshStandardMaterial({color:0x2a7fd4,transparent:true,opacity:.85}),1,1,1,false);
water.rotation.x=-Math.PI/2;water.position.set(0,-8,-150);scene.add(water);
const enemyBodyMat=M(0x9b4dff),whiteMat=M(0xffffff),yellowMat=M(0xffdd00);

function buildLevel(){
  level.clear();segs=[];crates=[];fruits=[];enemies=[];
  let z=10;
  while(z>-LEN){
    const len=12+Math.random()*14;segs.push([z-len,z]);
    const gt=groundTex.clone();gt.repeat.set(2,len/3);gt.needsUpdate=true;
    const gm=new THREE.Mesh(new THREE.BoxGeometry(W*2,1,len),[dirtMat,dirtMat,new THREE.MeshStandardMaterial({map:gt}),dirtMat,dirtMat,dirtMat]);
    gm.position.set(0,-.5,z-len/2);gm.receiveShadow=true;level.add(gm);
    if(z<0){
      const n=1+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const c=at(mesh(G.box,crateMat),(Math.random()*2-1)*(W-1),.5,z-2-Math.random()*(len-4));level.add(c);crates.push({m:c,alive:true});
      }
      if(Math.random()<.6&&z<-15){
        const e=new THREE.Group();
        e.add(at(mesh(G.sph,enemyBodyMat,.6,.5,.6),0,.5,0));
        for(const s of[-1,1]){e.add(at(mesh(G.sph,whiteMat,.15,.15,.15),s*.22,.75,.45));e.add(at(mesh(G.cone,yellowMat,.15,.4,.15),s*.3,1,0))}
        e.position.set(0,0,z-len/2);level.add(e);enemies.push({m:e,alive:true,ph:Math.random()*6,vy:0});
      }
      for(let i=0;i<4;i++){const f=at(mesh(G.sph,fruitMat,.25,.25,.25),Math.sin(z+i)*1.5,1.2,z-len*.2-i*1.5);level.add(f);fruits.push({m:f,alive:true})}
    }
    for(const s of[-1,1])for(let k=0;k<len/6;k++){
      const t=new THREE.Group();const h=3+Math.random()*3;
      t.add(at(mesh(G.cyl,trunkMat,.3,h,.3),0,h/2,0));
      for(let j=0;j<5;j++){const l=at(mesh(G.cone,leafMat,.4,2.5,.4),Math.cos(-j*1.25),h,Math.sin(j*1.25));l.rotation.z=Math.PI/2.4;l.rotation.y=j*1.25;t.add(l)}
      t.position.set(s*(W+1.5+Math.random()*3),-1,z-k*6-Math.random()*3);level.add(t);
    }
    z-=len+3+Math.random()*1.5;
  }
  const goal=new THREE.Group();
  goal.add(at(mesh(G.cyl,M(0xdddddd),.1,5,.1),0,2.5,0));
  goal.add(at(mesh(G.box,M(0xff3355),1.6,1,.05),.8,4.4,0));
  goal.position.set(0,0,segs.at(-1)[0]+3);level.add(goal);goalZ=goal.position.z;
}

const player=new THREE.Group();
const body=new THREE.Group();player.add(body);
const blue=M(0x3a8bff),cream=M(0xfff0d0);
body.add(at(mesh(G.sph,blue,.5,.6,.45),0,.8,0));
body.add(at(mesh(G.sph,cream,.32,.4,.2),0,.75,-.3));
body.add(at(mesh(G.sph,blue,.45,.42,.42),0,1.55,0));
const legs={};
for(const s of[-1,1]){
  const ear=at(mesh(G.cone,blue,.18,.45,.12),s*.28,2,0);ear.rotation.z=-s*.3;body.add(ear);
  body.add(at(mesh(G.sph,whiteMat,.12,.15,.08),s*.16,1.62,-.37));
  body.add(at(mesh(G.sph,M(0x111111),.06,.08,.05),s*.16,1.62,-.44));
  legs[s]=at(mesh(G.cyl,M(0xff7a00),.12,.5,.12),s*.2,.25,0);body.add(legs[s]);
}
body.add(at(mesh(G.sph,M(0xff5577),.08,.08,.08),0,1.5,-.42));
body.add(at(mesh(G.sph,cream,.18,.18,.18),0,.6,.45));
scene.add(player);
const shadowBlob=new THREE.Mesh(new THREE.CircleGeometry(.5,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3}));
shadowBlob.rotation.x=-Math.PI/2;scene.add(shadowBlob);
const spinFx=new THREE.Mesh(new THREE.TorusGeometry(1.1,.08,6,24),new THREE.MeshBasicMaterial({color:0xffee66,transparent:true,opacity:.7}));
spinFx.rotation.x=Math.PI/2;spinFx.visible=false;spinFx.position.y=.8;player.add(spinFx);

const parts=[];const pGeo=new THREE.BoxGeometry(.15,.15,.15);
for(let i=0;i<120;i++){const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:0xffffff}));m.visible=false;scene.add(m);parts.push({m,v:new THREE.Vector3(),life:0})}
let pi=0;
function burst(pos,color,n=12,sp=6){for(let i=0;i<n;i++){const p=parts[pi++%parts.length];p.m.visible=true;p.m.position.copy(pos);p.m.material.color.set(color);p.v.set((Math.random()-.5)*sp,Math.random()*sp,(Math.random()-.5)*sp);p.life=.8}}

let ac;
function snd(f,d=.1,type='square',f2=f,vol=.15){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
const S={jump:()=>snd(300,.15,'square',700),spin:()=>snd(800,.25,'sawtooth',200,.08),fruit:()=>snd(1200,.08,'sine',1800),crate:()=>snd(200,.2,'triangle',60,.3),enemy:()=>snd(600,.3,'square',100),hurt:()=>snd(400,.5,'sawtooth',80,.2),up:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.15,'square',f),i*100))};

const keys={};
const map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',Space:'j',KeyX:'s',ShiftLeft:'s',ShiftRight:'s'};
addEventListener('keydown',e=>{const k=map[e.code];if(k){keys[k]=true;e.preventDefault()}if(!playing&&(e.code==='Space'||e.code==='Enter')&&canStart())start()});
addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=false});
document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false},{passive:false});
  b.addEventListener('touchcancel',()=>keys[k]=false);
});
if('ontouchstart'in window||navigator.maxTouchPoints>0)$('touch').classList.remove('hide');

let st={},playing=false,high=0,overAt=0;
function canStart(){return !$('start').classList.contains('hide')||(!$('over').classList.contains('hide')&&performance.now()-overAt>500)}
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity=0,1200)}
function hud(){$('fr').textContent=st.fruits;$('cr').textContent=st.crates;$('sc').textContent=st.score;$('lv').textContent=st.lives}
function start(){
  if(playing)return;
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}
  for(const k in keys)keys[k]=false;
  buildLevel();
  st={fruits:0,crates:0,score:0,lives:3,vy:0,ground:true,spin:0,spinCd:0,inv:0,check:new THREE.Vector3(0,0,5),jumpHeld:true,dead:0,lifeAt:1};
  player.position.set(0,0,5);player.visible=true;hud();playing=true;
  $('start').classList.add('hide');$('over').classList.add('hide');
}
for(const id of['start','over']){
  const el=$(id);
  el.addEventListener('click',()=>{if(canStart())start()});
  el.addEventListener('touchend',e=>{e.preventDefault();if(canStart())start()},{passive:false});
}
function onGround(x,z){return Math.abs(x)<W+.2&&segs.some(s=>z>s[0]-.2&&z<s[1]+.2)}
function hurt(){
  if(st.inv>0||st.dead>0)return;
  st.lives--;S.hurt();burst(player.position.clone().setY(1),0x3a8bff,20);hud();
  if(st.lives<=0)return end(false);
  st.dead=1;player.visible=false;
}
function end(win){
  playing=false;high=Math.max(high,st.score);
  $('otitle').textContent=win?'ゴール！やったね！':'ゲームオーバー';
  $('oscore').textContent=`スコア：${st.score}（フルーツ ${st.fruits}・木箱 ${st.crates}）`;
  $('ohigh').textContent=`ハイスコア：${high}`;
  setTimeout(()=>{$('over').classList.remove('hide');overAt=performance.now()},win?300:900);
  if(win)S.up();else player.visible=false;
}
function addFruit(n=1){st.fruits+=n;st.score+=10*n;if(st.fruits>=100*st.lifeAt){st.lifeAt++;st.lives++;S.up();msg('1UP!')}hud()}
function breakCrate(c){c.alive=false;c.m.visible=false;st.crates++;st.score+=50;S.crate();burst(c.m.position,0xc8873a,16);
  const n=3+Math.floor(Math.random()*3);addFruit(n);burst(c.m.position.clone().setY(1.2),0xff3344,n*2,4)}

const clock=new THREE.Clock();const tmp=new THREE.Vector3();let t=0;
camera.position.set(0,5,14);
function update(dt){
  t+=dt;
  for(const p of parts)if(p.life>0){p.life-=dt;p.v.y-=15*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*8;if(p.life<=0)p.m.visible=false}
  for(const f of fruits)if(f.alive){f.m.rotation.y+=dt*3;f.m.position.y=1.2+Math.sin(t*3+f.m.position.z)*.15}
  for(const e of enemies){
    if(e.alive){e.m.position.x=Math.sin(t*1.5+e.ph)*(W-.8);e.m.children[0].scale.y=.5+Math.sin(t*10)*.05}
    else if(e.m.visible){e.vy-=20*dt;e.m.position.y+=e.vy*dt;e.m.position.z-=10*dt;e.m.rotation.x+=dt*10;if(e.m.position.y<-10)e.m.visible=false}
  }
  water.position.y=-8+Math.sin(t)*.1;
  if(!playing)return;
  const P=player.position;
  if(st.dead>0){st.dead-=dt;if(st.dead<=0){P.copy(st.check);st.vy=0;player.visible=true;st.inv=2}return}
  const sp=7;let mx=(keys.r?1:0)-(keys.l?1:0),mz=(keys.d?1:0)-(keys.u?1:0);
  const ml=Math.hypot(mx,mz);if(ml>0){mx/=ml;mz/=ml}
  const ox=P.x,oz=P.z;
  P.x+=mx*sp*dt;P.z+=mz*sp*dt;
  if(ml>0&&st.spin<=0){const a=Math.atan2(-mx,-mz);let d=a-body.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));body.rotation.y+=d*Math.min(1,dt*15)}
  const run=ml>0&&st.ground?Math.sin(t*18):0;
  legs[-1].rotation.x=run*.8;legs[1].rotation.x=-run*.8;
  if(keys.j&&!st.jumpHeld&&st.ground){st.vy=11;st.ground=false;S.jump()}
  st.jumpHeld=keys.j;
  if(!keys.j&&st.vy>4)st.vy=4;
  st.spinCd-=dt;
  if(keys.s&&st.spinCd<=0){st.spin=.5;st.spinCd=.7;S.spin()}
  if(st.spin>0){st.spin-=dt;body.rotation.y+=dt*30;spinFx.visible=true;spinFx.rotation.z+=dt*20}else spinFx.visible=false;
  st.vy-=30*dt;P.y+=st.vy*dt;
  let floor=onGround(P.x,P.z)?0:-100;
  for(const c of crates){if(!c.alive)continue;const cp=c.m.position;
    const dx=P.x-cp.x,dz=P.z-cp.z;
    if(st.spin>0&&Math.hypot(dx,dz)<1.6&&Math.abs(P.y-cp.y)<1.5){breakCrate(c);continue}
    if(Math.abs(dx)<.85&&Math.abs(dz)<.85){
      if(P.y>=.7&&st.vy<=0){if(P.y+st.vy*dt<1.05){breakCrate(c);st.vy=9;S.jump()}}
      else if(P.y<.9){P.x=ox;P.z=oz}
    }
  }
  if(P.y<=floor&&floor>-50&&st.vy<=0){P.y=floor;st.vy=0;if(!st.ground)burst(tmp.copy(P),0xccaa77,4,2);st.ground=true}
  else if(P.y>floor+.01)st.ground=false;
  if(st.ground&&floor===0)st.check.set(P.x,0,P.z);
  if(P.y<-6)hurt();
  for(const f of fruits)if(f.alive&&f.m.position.distanceTo(tmp.copy(P).setY(P.y+.9))<1){f.alive=false;f.m.visible=false;S.fruit();addFruit();burst(f.m.position,0xff3344,6,3)}
  for(const e of enemies){if(!e.alive)continue;const ep=e.m.position;const d=Math.hypot(P.x-ep.x,P.z-ep.z);
    if(d<1.6&&st.spin>0){e.alive=false;e.vy=10;st.score+=100;S.enemy();burst(ep.clone().setY(.5),0x9b4dff,15);hud();continue}
    if(d<1&&P.y<1.2){if(P.y>.5&&st.vy<0){e.alive=false;e.vy=6;st.vy=10;st.score+=100;S.enemy();burst(ep.clone().setY(.5),0x9b4dff,15);hud()}else hurt()}
  }
  if(st.inv>0){st.inv-=dt;player.visible=Math.floor(st.inv*15)%2===0;if(st.inv<=0)player.visible=true}
  if(playing&&P.z<goalZ+1&&Math.abs(P.x)<2){st.score+=1000+st.lives*500;hud();burst(P.clone().setY(2),0xffcc33,40,10);end(true)}
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);update(dt);
  const P=player.position;
  shadowBlob.visible=player.visible&&onGround(P.x,P.z);shadowBlob.position.set(P.x,.02,P.z);
  shadowBlob.scale.setScalar(Math.max(.3,1-P.y*.12));
  tmp.set(P.x*.5,Math.max(P.y,0)*.5+5,P.z+9);camera.position.lerp(tmp,.08);
  camera.lookAt(P.x*.7,Math.max(P.y,0)*.5+1,P.z-4);
  sun.position.set(P.x+8,20,P.z+5);sun.target.position.set(P.x,0,P.z-5);
  renderer.render(scene,camera);
}
buildLevel();loop();
</script>
</body>
</html>
